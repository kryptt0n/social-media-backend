spring.application.name=ms-os-identity
server.port=8280

spring.cloud.consul.host=consul-server
spring.cloud.consul.port=8500

oauth.domain=${OAUTH_DOMAIN}
oauth.client.id=${OAUTH_CLIENT_ID}
oauth.client.secret=${OAUTH_CLIENT_SECRET}
oauth.redirect=${OAUTH_REDIRECT}
oauth.username.url=${OAUTH_USERNAME_URL}
oauth.main.url=${OAUTH_MAIN_URL}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=0

#Database configuration
#spring.datasource.url=jdbc:mysql://social-media-database:3306/${DB_DATABASE}
#spring.datasource.username=${DB_USERNAME}
#spring.datasource.password=${DB_PASSWORD}
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
#spring.jpa.hibernate.ddl-auto=update

# Register this service in Consul
spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=10s
# Expose health endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always